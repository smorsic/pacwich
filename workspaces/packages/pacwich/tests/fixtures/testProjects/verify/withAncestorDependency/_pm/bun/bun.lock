      "name": "consumer",
    },
  },
  "packages": {
    "shared-lib": ["shared-lib@workspace:packages/shared-lib"],

    "app": ["app@workspace:packages/app"],

    "other-lib": ["other-lib@workspace:packages/other-lib"],

    "sibling-declarer": ["sibling-declarer@workspace:packages/sibling-declarer"],

    "consumer": ["consumer@workspace:packages/consumer"],
