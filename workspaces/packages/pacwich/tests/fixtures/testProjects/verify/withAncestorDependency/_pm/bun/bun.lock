{
  "lockfileVersion": 1,
  "configVersion": 1,
  "workspaces": {
    "": {
      "name": "verify-ancestor-root",
      "dependencies": {
        "shared-lib": "workspace:*",
      },
    },
    "packages/shared-lib": {
      "name": "shared-lib",
    },
    "packages/app": {
      "name": "app",
    },
    "packages/other-lib": {
      "name": "other-lib",
    },
    "packages/sibling-declarer": {
      "name": "sibling-declarer",
