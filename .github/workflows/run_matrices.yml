name: Run All Matrices

on:
  workflow_dispatch:
    inputs:
      test_args:
        description: Extra arguments to pass to the test script
        required: false
        type: string

permissions:
  contents: read

jobs:
  runtime_matrix:
    name: Runtime Matrix
    uses: ./.github/workflows/runtime_matrix.yml
    with:
      test_args: ${{ inputs.test_args }}
  pm_matrix:
    name: Package Manager Matrix
    uses: ./.github/workflows/pm_matrix.yml
    with:
      test_args: ${{ inputs.test_args }}
